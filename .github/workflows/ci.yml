name: CI

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    verify:
        name: Validacion de codigo
        runs-on: ubuntu-latest

        # El runner corre en UTC y el sitio se construye con la hora del proceso:
        # el año del copyright del pie sale de `new Date().getFullYear()`. Un build
        # lanzado un 31 de diciembre por la tarde en Ecuador ya es 1 de enero en
        # UTC, y saldría con el año equivocado. Se fija aquí, igual que en el resto
        # de repositorios de Movía, para que CI y producción cuenten el mismo día.
        env:
            TZ: America/Guayaquil

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - run: npm run lint

            # `--no-watch` explícito aunque hoy no haga falta: el builder de pruebas
            # de Angular decide el modo vigilancia por TTY («true en TTY, false en el
            # resto»), así que en un runner ya sale sin vigilancia. Pero eso es un
            # comportamiento por defecto, no un contrato, y si algún día cambia el
            # job no falla: se queda colgado hasta el límite de seis horas. La
            # bandera va aquí y no en `package.json` porque en local sí se quiere
            # la vigilancia al escribir pruebas.
            - run: npm run test -- --no-watch

            - run: npm run build:prod

    secret-scan:
        name: Escaneo de secretos
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  # Gitleaks necesita el historial completo: sin esto solo mira el
                  # ultimo commit y se le escapa un secreto que se colo dias atras.
                  fetch-depth: 0

            - uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Los workflows son el único código de este repositorio que NO valida nadie:
    # no pasan por ESLint, no pasan por el compilador y no tienen pruebas. Un
    # `uses:` mal escrito o una expresión `${{ }}` inválida no se descubre hasta
    # que el run falla, y en el caso de `deploy.yml` eso es enterarse a mitad de
    # un despliegue a producción.
    #
    # actionlint es un binario de Go, así que aquí se descarga —en local no hay
    # forma cómoda: no existe paquete de npm con ejecutable.
    actionlint:
        name: Validacion de los workflows
        runs-on: ubuntu-latest

        env:
            # La version de actionlint, en un UNICO sitio. De aqui salen las tres
            # cosas que la nombran: la etiqueta de la release, el nombre del tar y
            # el del archivo de checksums.
            ACTIONLINT_VERSION: 1.7.12

        steps:
            # `fetch-depth: 0` porque el paso siguiente compara dos commits para
            # saber si hay que hacer algo: con el historial recortado, ese `git
            # diff` no encuentra la base y falla.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # El job entero está en el workflow de CI, que corre siempre, pero
            # actionlint solo tiene sentido si ha cambiado algún workflow. En vez
            # de un `paths:` arriba —que filtraría TODO el CI, incluidos lint,
            # pruebas y build— se decide aquí, comparando los archivos tocados.
            #
            # Ante la duda, se valida: si no hay base con la que comparar (una
            # rama nueva trae `before` a ceros, y un push forzado puede dejar un
            # SHA que ya no existe), sale `true` y actionlint corre igual. Salir
            # por lo barato dejaría los workflows sin revisar justo cuando más
            # raro está el historial.
            - name: Detectar cambios en los workflows
              id: cambios
              env:
                  # Por `env:` y no interpolado dentro del script: es la forma de
                  # que un valor del evento no pueda acabar ejecutandose como
                  # parte del comando.
                  EVENTO: ${{ github.event_name }}
                  BASE_PR: ${{ github.event.pull_request.base.sha }}
                  BASE_PUSH: ${{ github.event.before }}
                  ACTUAL: ${{ github.sha }}
              run: |
                  if [ "$EVENTO" = "pull_request" ]; then
                    base="$BASE_PR"
                  else
                    base="$BASE_PUSH"
                  fi

                  if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                    echo "Sin base con la que comparar: se valida de todas formas."
                    echo "workflows=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  if git diff --name-only "$base" "$ACTUAL" | grep -q '^\.github/workflows/'; then
                    echo "workflows=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "Ningun workflow ha cambiado: se salta actionlint."
                    echo "workflows=false" >> "$GITHUB_OUTPUT"
                  fi

            # Descarga DIRECTA del binario, sin pasar por `download-actionlint.bash`.
            #
            # Ese script fallaba en el runner: bajaba 92 bytes en lugar del tar
            # —no seguia la redireccion con la que GitHub sirve los artefactos de
            # una release— y `tar` abortaba con «not in gzip format». Noventa y dos
            # bytes es el tamano de una respuesta de redireccion, no de un binario
            # de 5 MB, asi que lo que se extraia era una pagina, no el programa.
            #
            # Haciendolo aqui se gana ademas lo que el script no daba: la descarga
            # se VERIFICA antes de ejecutar nada. Sin esa comprobacion, este paso
            # descarga un binario de internet y lo ejecuta contra el repositorio;
            # con ella, si el archivo no es exactamente el que publico la release,
            # el paso se detiene.
            #
            # `curl -sSfL`: la `f` hace que un 404 devuelva error en vez de guardar
            # la pagina de error como si fuera el tar, y la `L` sigue la redireccion
            # que es justo lo que le faltaba al script.
            #
            # El `grep` va a un archivo y no por tuberia a proposito: como comando
            # suelto, si la linea no aparece devuelve 1 y el `set -e` del shell para
            # el paso. Dentro de una tuberia ese fallo se perderia, porque GitHub no
            # activa `pipefail`.
            #
            # `tar` extrae SOLO `actionlint`: el archivo trae tambien LICENSE,
            # README, la pagina de manual y la carpeta `docs/`, y nada de eso pinta
            # en el directorio de trabajo del job.
            #
            # `linux_amd64` porque los runners de `ubuntu-latest` son x86-64. Si eso
            # cambiara algun dia, el `--version` de abajo falla en el acto con
            # «cannot execute binary file», que es mejor que un error a media
            # ejecucion.
            - name: Instalar actionlint
              if: steps.cambios.outputs.workflows == 'true'
              run: |
                  base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
                  tar_gz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  checksums="actionlint_${ACTIONLINT_VERSION}_checksums.txt"

                  curl -sSfL "${base}/${tar_gz}" -o "${tar_gz}"
                  curl -sSfL "${base}/${checksums}" -o "${checksums}"

                  grep " ${tar_gz}$" "${checksums}" > esperado.sha256
                  sha256sum --check --strict esperado.sha256

                  tar -xzf "${tar_gz}" actionlint
                  ./actionlint --version

            - name: Validar los workflows
              if: steps.cambios.outputs.workflows == 'true'
              run: ./actionlint -color

