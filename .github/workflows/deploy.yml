name: Deploy

# Titulo de cada ejecucion en la lista de Actions. Sin esto, al venir de
# `workflow_dispatch` GitHub no tiene mensaje de commit que mostrar y todas las
# ejecuciones se llaman igual, sin distinguir un deploy normal de un rollback.
run-name: 🚀 Deploy ${{ inputs.ref && format('de {0}', inputs.ref) || 'de main' }} por @${{ github.actor }}

# SOLO a mano. No hay disparador por push y es deliberado: lo que llega a main
# se valida en CI, pero quién y cuándo lo publica en moviapass.com es una
# decisión de personas.
on:
    workflow_dispatch:
        inputs:
            ref:
                description: 'Commit SHA o tag a desplegar (vacío = último de main)'
                required: false
                default: ''

concurrency:
    group: deploy-web-produccion
    cancel-in-progress: false

permissions:
    # Necesario para que GitHub emita el token OIDC con el que se asume el rol.
    id-token: write
    contents: read

jobs:
    desplegar:
        name: 🚀 Deploy a producción
        runs-on: ubuntu-latest
        environment: production

        steps:
            # Aquí no hay servidor que haga `git checkout`: lo que se publica es
            # un montón de archivos estáticos, así que el rollback se resuelve en
            # el propio checkout. Con `ref` vacío, actions/checkout toma la rama
            # por defecto.
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            # En el resumen y no solo en los logs: al abrir el run se ve qué hay
            # en producción sin desplegar ningún paso.
            - name: Mostrar commit desplegado
              run: |
                  echo "### 🚀 Desplegado en moviapass.com" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Commit:** \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
                  echo "**Mensaje:** $(git log -1 --pretty=%s)" >> $GITHUB_STEP_SUMMARY
                  echo "**Autor:** $(git log -1 --pretty=%an)" >> $GITHUB_STEP_SUMMARY

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            # `outputMode: "static"`: esto prerenderiza un index.html por ruta
            # dentro de dist/web-movia/browser. No se despliega ningún servidor
            # de Node, solo esa carpeta.
            - run: npm run build:prod

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: us-east-1

            # ── Las tres pasadas de sincronización ────────────────────────────
            #
            # El dist mezcla archivos con y sin hash en el nombre, y NO se pueden
            # cachear igual. Antes esta sincronización iba en dos pasadas, «HTML» y
            # «todo lo demás», y ese «todo lo demás» se subía con un año de
            # `immutable`: se llevaba por delante las 52 imágenes e iconos que vienen
            # de `public/` —que no llevan hash y se sirven siempre con el mismo
            # nombre— y también `robots.txt` y `sitemap.xml`. Un `robots.txt`
            # equivocado con `immutable` es un año sin poder corregirlo.
            #
            # Ahora son tres grupos, y los filtros los PARTICIONAN: cada clave cae en
            # una pasada y solo una. Eso es lo que evita que un archivo se suba dos
            # veces con cabeceras distintas, y lo que hace seguro el `--delete` donde
            # lo hay: una pasada solo puede borrar dentro de su grupo, así que ninguna
            # borra lo que otra acaba de subir.
            #
            # Borran los grupos 2 y 3, y NO el 1. Los archivos con hash se acumulan a
            # propósito; el porqué está entero sobre el paso del grupo 1.
            #
            # Los filtros van por PATRÓN y no por lista de archivos: una imagen nueva
            # en `public/` cae sola en el grupo 2 sin tocar este archivo. El grupo 2
            # es además el cajón por defecto, y a propósito: lo que no se reconoce se
            # cachea un día, nunca un año. Equivocarse hacia un día se arregla al día
            # siguiente; equivocarse hacia `immutable` no se arregla.
            #
            # El orden importa por otra razón: primero el código y las imágenes que
            # el HTML nuevo va a pedir, y el HTML al final. Al revés habría una
            # ventana en la que la página nueva referencia archivos que aún no están.
            #
            # Recordatorio de cómo funcionan los filtros de `aws s3 sync`: se evalúan
            # EN ORDEN sobre la clave completa, gana el ÚLTIMO que casa, se parte de
            # «incluido», y el `*` SÍ cruza las barras (por eso `*.html` coge
            # `legal/terms/index.html`). Y lo que los filtros excluyen queda excluido
            # también del `--delete`.

            # GRUPO 1 · Con hash en el nombre, generados por Angular.
            #
            # `outputHashing: "all"` mete un hash de 8 caracteres en cada bundle
            # (`main-EUQ5FH5G.js`, `chunk-0xu6aOu1.js`, `styles-EY4R6GX5.css`), así
            # que el contenido de una clave NUNCA cambia: si cambia el contenido,
            # cambia el nombre. Es el único caso en el que `immutable` es correcto, y
            # el que de verdad interesa que lo sea, porque son los archivos pesados.
            #
            # Se filtra por extensión y no por el patrón del hash: hoy los 23 .js y
            # .css del dist lo llevan sin excepción, y un `*-????????.js` se rompería
            # solo si Angular cambiase la longitud del hash.
            #
            # ⚠️  ESTA PASADA NO LLEVA `--delete`, Y ES A PROPÓSITO. NO LO AÑADAS.
            #
            # Los archivos con hash se ACUMULAN en el bucket queriendo. El motivo es
            # que un despliegue no es instantáneo y el HTML viejo sigue vivo un rato:
            #
            #   · Durante el despliegue, entre esta pasada y la del grupo 3 pasan
            #     segundos en los que el HTML antiguo sigue sirviéndose y pide los
            #     chunks antiguos. Si se hubieran borrado, esas peticiones son 404 y
            #     la página se rompe a media carga.
            #   · Después del despliegue es peor, porque dura más: quien tenga la
            #     página abierta conserva el HTML viejo en memoria, y al navegar a
            #     otra ruta el router pide un chunk perezoso —`loadComponent`— con el
            #     hash antiguo. Borrado ese chunk, la navegación falla en la cara de
            #     alguien que no ha hecho nada raro. Y la caché de CloudFront alarga
            #     la ventana hasta que la invalidación termina de propagarse.
            #
            # Borrarlos no aporta nada a cambio: son 23 archivos de unos 400 KB en
            # total, sus nombres no pueden colisionar nunca —el hash es del contenido,
            # así que dos builds distintos no generan la misma clave— y no se sirven a
            # nadie salvo que un HTML los pida. Lo único que crece es la factura de
            # almacenamiento de S3, en céntimos.
            #
            # La limpieza, cuando haga falta, va a mano y con criterio: el comando
            # está al final de este archivo.
            - name: 'Grupo 1 · JS y CSS con hash (caché de un año, SIN --delete)'
              run: |
                  aws s3 sync dist/web-movia/browser s3://moviapass-com \
                    --exclude "*" --include "*.js" --include "*.css" \
                    --cache-control "public,max-age=31536000,immutable"

            # GRUPO 2 · Sin hash, vienen de `public/`: imágenes, iconos, favicons,
            # la imagen social, el logo de marca y el manifest.
            #
            # Se sirven siempre con la misma clave, así que `immutable` los dejaría
            # congelados hasta un año en el navegador de quien ya hubiera entrado.
            # Pasó con `favicon.png` al reemplazarlo: el navegador seguía dando el
            # viejo de 557 × 565. Un día es el equilibrio: se siguen cacheando bien y
            # una corrección llega en 24 horas sin tener que renombrar el archivo.
            #
            # Este es el grupo POR DEFECTO. No enumera lo que incluye, sino que
            # excluye a los otros dos, de modo que cualquier cosa nueva que aparezca
            # en `public/` —un .avif, una fuente, un vídeo— cae aquí sola.
            - name: 'Grupo 2 · Estáticos de public/ sin hash (caché de un día)'
              run: |
                  aws s3 sync dist/web-movia/browser s3://moviapass-com \
                    --delete \
                    --exclude "*.js" --exclude "*.css" --exclude "*.html" \
                    --exclude "robots.txt" --exclude "sitemap.xml" \
                    --cache-control "public,max-age=86400"

            # El paso de arriba sube `manifest.webmanifest` con el `content-type`
            # equivocado, y no es culpa suya: `aws s3 sync` deduce el tipo de la
            # extensión con la tabla `mimetypes` de Python, y `.webmanifest` NO está
            # en ella. Lo sube entonces como `application/octet-stream` o
            # `binary/octet-stream`, y un navegador que recibe eso descarta el
            # manifest: se queda sin nombre, sin iconos y sin «Añadir a pantalla de
            # inicio», con un aviso en consola que no dice de dónde viene.
            #
            # Se arregla copiando el objeto SOBRE SÍ MISMO. `--metadata-directive
            # REPLACE` es lo que obliga a S3 a reescribir los metadatos en lugar de
            # conservarlos, que es lo que haría por defecto en una copia. Y hay que
            # repetir aquí el `cache-control`, porque REPLACE sustituye TODOS los
            # metadatos: si no se pone, el objeto se queda sin él y pierde el día de
            # caché que le acaba de dar el grupo 2.
            #
            # Va como paso aparte y no dentro del sync porque `--content-type` se
            # aplicaría a todos los archivos de la pasada, no solo a este.
            - name: 'Grupo 2 bis · Corregir el content-type del manifest'
              run: |
                  aws s3 cp \
                    s3://moviapass-com/manifest.webmanifest \
                    s3://moviapass-com/manifest.webmanifest \
                    --metadata-directive REPLACE \
                    --content-type "application/manifest+json" \
                    --cache-control "public,max-age=86400"

            # GRUPO 3 · Lo que tiene que estar fresco siempre: el HTML de las diez
            # rutas prerenderizadas, `robots.txt` y `sitemap.xml`.
            #
            # El HTML es el que apunta a los bundles con hash: si se cachea, la gente
            # sigue viendo la versión anterior por mucho que el resto se haya
            # actualizado. Y los dos archivos de rastreo se corrigen el mismo día en
            # que se detecta el error, no al año siguiente.
            #
            # `robots.txt` y `sitemap.xml` casan la clave EXACTA de la raíz, no
            # cualquier `.txt` o `.xml`: un `legal/sitemap.xml` caería en el grupo 2,
            # que es lo correcto.
            #
            # El `--exclude` final va el ÚLTIMO y por eso gana: saca `index.csr.html`
            # —el cascarón vacío de client-side rendering que el build emite siempre—
            # de la subida, así que nunca llega a publicarse. Al quedar fuera de los
            # filtros queda también fuera del `--delete`, y no lo borra ninguna
            # pasada; hoy da igual porque nunca se ha subido.
            - name: 'Grupo 3 · HTML, robots y sitemap (sin caché)'
              run: |
                  aws s3 sync dist/web-movia/browser s3://moviapass-com \
                    --delete \
                    --exclude "*" --include "*.html" --include "robots.txt" --include "sitemap.xml" \
                    --exclude "index.csr.html" \
                    --cache-control "no-cache"

            - name: Invalidar caché de CloudFront
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
                    --paths "/*"

            - name: Verificar sitio
              run: |
                  sleep 20
                  curl -sfI https://moviapass.com | head -1

# ── Limpiar a mano los chunks antiguos ────────────────────────────────────────
#
# El grupo 1 no borra, así que los .js y .css de builds anteriores se quedan en
# el bucket. Es lo que se quiere (ver el comentario de ese paso), pero cada
# despliegue deja unos cuantos y conviene barrer de vez en cuando: una vez cada
# muchos despliegues, o cuando el bucket empiece a pesar.
#
# NADA DE ESTO SE EJECUTA AUTOMÁTICAMENTE, Y NO DEBE. Va a mano, mirando lo que
# se borra, porque un chunk que todavía referencia alguien es una navegación
# rota en la cara de un usuario.
#
# 1) Qué chunks pide el sitio AHORA MISMO. Esta es la lista intocable: sale del
#    HTML que se está sirviendo, no del dist local, que puede ir por delante.
#
#      for ruta in "" plans partners corporate contact help legal; do
#        aws s3 cp "s3://moviapass-com/${ruta:+$ruta/}index.html" - 2>/dev/null
#      done | grep -oE '(main|chunk|styles)-[A-Za-z0-9_-]{8}\.(js|css)' | sort -u
#
# 2) Todos los que hay en el bucket, del más viejo al más nuevo. La fecha es la
#    de subida, así que los de arriba son los candidatos.
#
#      aws s3api list-objects-v2 --bucket moviapass-com \
#        --query "sort_by(Contents, &LastModified)[?ends_with(Key, '.js') || ends_with(Key, '.css')].[LastModified, Size, Key]" \
#        --output text
#
# 3) La diferencia entre (2) y (1) es lo que sobra. Se borra DE UNA EN UNA y por
#    su clave exacta:
#
#      aws s3 rm s3://moviapass-com/chunk-VIEJO123.js
#
#    Nunca con `--recursive` y nunca con comodín: en la raíz de este bucket eso
#    se lleva el sitio por delante.
#
# Margen de seguridad: no borres nada de los últimos despliegues aunque no
# aparezca en (1). Alguien puede tener la pestaña abierta desde ayer con el HTML
# viejo en memoria, y su router seguirá pidiendo aquellos chunks al navegar.
#
# La alternativa a hacerlo a mano es una regla de ciclo de vida en el bucket que
# expire los objetos por antigüedad. Se configura en S3, no aquí, y habría que
# acotarla a `.js` y `.css` para que no se lleve las imágenes de `public/`, que
# no cambian de nombre nunca.
