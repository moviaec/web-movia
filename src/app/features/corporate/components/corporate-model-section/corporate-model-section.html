<section class="bg-surface" aria-labelledby="corporate-model-title">
	<div class="max-w-content mx-auto px-6 pt-16 pb-16 lg:px-8 lg:pt-[6.26rem] lg:pb-[5.5rem]">
		<!--
			Dos columnas solo para el titular y la foto: las tarjetas van debajo, a todo el
			ancho. La foto SE SALE por arriba y se monta sobre el hero (69 px medidos), de ahí
			el margen negativo, que vale el padding de la sección más ese montaje.
		-->
		<div class="lg:grid lg:grid-cols-[1fr_45.1%] lg:gap-x-[3.1%]">
			<div class="lg:pl-[2.68rem]">
				<h2 id="corporate-model-title" class="font-display text-ink text-4xl font-bold lg:text-[3.3rem] lg:leading-[1.12]">
					Cómo funciona el modelo 50/50
				</h2>

				<p class="text-ink mt-6 lg:mt-[2.05rem] lg:text-[1.2rem]">
					Movia se integra como un beneficio corporativo co-financiado, sencillo de administrar y con estructura fiscal óptima:
				</p>
			</div>

			<!-- La foto no está en el diseño de móvil, solo en el de escritorio. -->
			<img
				class="hidden h-auto w-full rounded-2xl lg:-mt-[10.56rem] lg:block lg:self-start"
				ngSrc="/imgs/corporate/modelo.webp"
				width="1000"
				height="775"
				priority
				alt="Una persona haciendo flexiones sobre una pista de atletismo"
			/>
		</div>

		<ul class="mt-10 grid gap-6 lg:mt-[2.42rem] lg:grid-cols-2 lg:gap-x-[3%] lg:gap-y-[2.47rem]">
			@for (step of steps; track step.title) {
				<li class="bg-primary text-primary-contrast rounded-2xl p-6 lg:flex lg:gap-[1.2rem] lg:px-[1.96rem] lg:pt-[2.3rem] lg:pb-[2.75rem]">
					<span class="icon-mask icon-flecha-diagonal bg-primary-contrast size-6 shrink-0 lg:mt-1.5 lg:size-5" aria-hidden="true"></span>

					<span class="mt-6 block lg:mt-0">
						<strong class="font-display block text-2xl font-semibold lg:text-[1.9rem] lg:leading-[1.26]">{{ step.title }}</strong>
						<span class="mt-3 block lg:mt-[0.9rem] lg:text-base">{{ step.note }}</span>
					</span>
				</li>
			}
		</ul>
	</div>
</section>
