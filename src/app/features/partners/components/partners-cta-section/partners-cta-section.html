<!--
	El cierre es una BANDA lima a sangre, no una tarjeta: ocupa la sección entera, sin
	contenedor centrado, sin radio y sin hueco por arriba ni por abajo. Ya no se monta
	sobre la banda carbón de «¿Cómo funciona?», así que esa sección tampoco necesita el
	padding inferior gigante que existía solo para hacerle sitio.

	El padding que queda es el de DENTRO de la banda, el que separa el texto de sus bordes.
-->
<section class="bg-primary text-center" aria-labelledby="partners-cta-title">
	<div class="px-6 pt-14 pb-6 lg:px-8 lg:pt-[3.75rem] lg:pb-[2.9rem]">
		<h2
			id="partners-cta-title"
			class="font-display text-primary-contrast mx-auto max-w-[18.5rem] text-4xl font-bold lg:max-w-none lg:text-[2.85rem]"
		>
			Convierte tus spots vacíos en ingresos
		</h2>

		<p class="text-primary-contrast lg:text-lead mx-auto mt-16 max-w-[17.5rem] text-xl lg:mt-3.5 lg:max-w-[46.5%]">
			Sin costo inicial. Empieza hoy y crece desde el primer check-in.
		</p>

		<a
			class="bg-secondary text-secondary-contrast hover:bg-secondary-shade mt-20 flex w-full items-center justify-center rounded-full px-10 py-3 font-medium transition-colors lg:mt-6 lg:inline-flex lg:w-auto lg:px-12 lg:py-[1.1rem]"
			[href]="portalUrl"
			target="_blank"
			>Quiero ser Partner</a
		>
	</div>
</section>
