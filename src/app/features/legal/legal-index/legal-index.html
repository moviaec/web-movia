<!-- CABECERA -->
<section class="bg-secondary text-secondary-contrast" aria-labelledby="legal-title">
	<div class="max-w-content mx-auto px-6 pt-40 pb-16 lg:px-8 lg:pt-45 lg:pb-20">
		<h1 id="legal-title" class="font-display lg:text-headline text-3xl font-bold">Información legal</h1>

		<p class="lg:text-body-lg mt-6 max-w-2xl text-lg">{{ intro }}</p>
	</div>
</section>
<!-- END CABECERA -->

<!-- DOCUMENTOS -->
<section class="bg-surface" aria-labelledby="legal-documents-title">
	<div class="max-w-content mx-auto px-6 py-16 lg:px-8 lg:py-20">
		<h2 id="legal-documents-title" class="font-display text-ink lg:text-headline text-2xl font-bold">Documentos</h2>

		<ul class="mt-8 grid gap-4 lg:mt-10 lg:grid-cols-3 lg:gap-6">
			@for (document of documents; track document.id) {
				<li class="border-border hover:border-secondary rounded-2xl border p-6 transition-colors lg:p-7">
					<h3 class="font-display text-ink text-xl font-semibold">
						<!--
							El enlace envuelve SOLO el título y no la tarjeta entera: el texto del
							enlace es lo que Google lee como descripción del destino, y una tarjeta
							entera convertida en enlace le da el resumen de propina y lo diluye.
						-->
						<a class="hover:text-primary-shade transition-colors" [routerLink]="document.path">{{ document.title }}</a>
					</h3>

					<p class="text-muted mt-3">{{ document.summary }}</p>
				</li>
			}
		</ul>
	</div>
</section>
<!-- END DOCUMENTOS -->
