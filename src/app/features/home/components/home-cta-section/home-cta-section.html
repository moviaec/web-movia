<section class="bg-surface" aria-labelledby="home-cta-title">
	<div class="bg-primary rounded-t-hero relative">
		<div class="max-w-content mx-auto grid gap-10 px-6 pt-16 text-center lg:grid-cols-[1fr_60.3%] lg:items-center lg:px-8 lg:pt-19 lg:text-left">
			<div class="lg:pb-19">
				<h2 id="home-cta-title" class="font-display text-primary-contrast lg:text-headline text-3xl font-bold">Muévete con Movia</h2>

				<p class="text-primary-contrast lg:text-lead mt-6 text-lg">Una membresía. Todo el deporte y el bienestar de Ecuador.</p>

				<!--
					Relleno de carbón —el azul oscuro de la marca, `secondary`— con texto blanco, que
					es la acción principal del sitio; al pasar por encima se invierte a blanco con
					texto carbón. El borde se queda en las dos: en el hover es lo que le da forma al
					botón sobre la banda lima. Antes el texto del hover pasaba a lima y ahí el botón
					se quedaba sin leer.
				-->
				<a
					class="border-secondary bg-secondary text-secondary-contrast hover:bg-surface hover:text-ink mt-10 inline-flex w-full items-center justify-center rounded-full border px-6 py-3 transition-colors sm:w-auto"
					routerLink="/plans"
					>Quiero suscribirme</a
				>
			</div>

			<img
				class="mx-auto h-auto w-full max-w-md lg:-mt-[7rem] lg:w-full lg:max-w-none"
				ngSrc="/imgs/home/cta-persona.webp"
				width="1000"
				height="615"
				alt="Persona con los brazos abiertos celebrando después de entrenar"
			/>
		</div>
	</div>
</section>
