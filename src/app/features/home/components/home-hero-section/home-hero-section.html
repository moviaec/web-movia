<section class="bg-secondary rounded-b-hero relative isolate overflow-hidden" aria-labelledby="home-hero-title">
	<!--
		Art direction: el recorte de móvil no es el de escritorio, así que van dos archivos
		y un <picture>. Por eso no se usa NgOptimizedImage aquí (no soporta <picture>); el
		peso de LCP lo marca `fetchpriority="high"`.
	-->
	<picture>
		<source media="(min-width: 1024px)" srcset="/imgs/home/hero.jpg" />
		<img
			class="absolute inset-0 -z-10 size-full object-cover"
			src="/imgs/home/hero-movil.jpg"
			alt="Tres personas entrenando de noche: carrera, tenis y atletismo"
			width="1731"
			height="1025"
			fetchpriority="high"
		/>
	</picture>

	<!--
		Velo de carbón al 65 %. No es un apaño de contraste: es lo que mide el diseño. Sobre
		la foto entregada, el color del mockup sale con `0,7 × carbón + 0,3 × foto`, y sin el
		velo el hero se ve mucho más claro que la maqueta (y el subtítulo pierde contraste).
	-->
	<div class="bg-secondary/65 absolute inset-0 -z-10"></div>

	<div class="max-w-content mx-auto px-6 pt-36 pb-28 text-center lg:px-8 lg:pt-73.5 lg:pb-37">
		<h1 id="home-hero-title" class="font-display text-secondary-contrast lg:text-display text-4xl font-extrabold sm:text-5xl">
			Move Freely.<br />
			<span class="text-primary">Belong Everywhere.</span>
		</h1>

		<p class="text-secondary-contrast lg:text-lead mt-6 text-xl">Deporte y bienestar a tu medida en una sola app</p>
	</div>
</section>

<div class="bg-surface relative z-10">
	<div class="max-w-content mx-auto px-6 lg:px-8">
		<ul class="-mt-20 grid gap-4 lg:-mt-17 lg:grid-cols-3 lg:gap-20">
			@for (card of cards; track card.path) {
				<li>
					<a class="bg-surface-muted rounded-card hover:bg-primary/20 block h-full p-6 transition-colors lg:p-6.5" [routerLink]="card.path">
						<span class="flex items-start justify-between gap-4">
							<span class="font-display text-ink text-title font-semibold">{{ card.title }}</span>
							<span class="icon-mask icon-flecha-diagonal bg-ink size-6"></span>
						</span>

						<span class="text-ink mt-6 block lg:mt-8">
							<strong class="font-semibold">{{ card.lead }}</strong>
							{{ card.rest }}
						</span>
					</a>
				</li>
			}
		</ul>
	</div>
</div>
