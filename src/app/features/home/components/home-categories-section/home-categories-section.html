<section class="bg-surface-shade" aria-labelledby="home-categories-title">
	<div class="max-w-content lg:pt-section mx-auto px-6 pt-16 lg:px-8">
		<h2 id="home-categories-title" class="font-display lg:text-headline text-ink text-3xl font-bold">Categorías de actividades</h2>

		<p class="text-ink lg:text-lead mt-6 max-w-2xl text-lg">
			Con Movia accedes a ocho categorías de deporte y bienestar en la red de centros aliados
		</p>
	</div>

	<!--
		La tira de fotos cruza el borde entre la parte blanca y la oscura: la banda de carbón
		empieza al 56 % de la altura de la foto central, que es lo que mide el diseño.
	-->
	<div class="relative mt-10 lg:mt-16">
		<div class="bg-secondary absolute inset-x-0 top-[56%] bottom-0"></div>

		<ul
			class="relative flex snap-x snap-mandatory items-center gap-4 overflow-x-auto px-6 pb-4 lg:justify-center lg:gap-[1.75rem] lg:overflow-visible lg:px-8 lg:pb-0"
		>
			@for (category of categories; track category.image; let index = $index) {
				<li class="shrink-0 snap-center">
					<img
						class="rounded-card h-72 w-auto max-w-none object-cover"
						[class]="index === 2 ? 'lg:h-[20.1rem]' : index === 1 || index === 3 ? 'lg:h-[17.2rem]' : 'lg:h-[15.1rem]'"
						ngSrc="{{ category.image }}"
						width="516"
						height="644"
						[alt]="category.name"
					/>
				</li>
			}
		</ul>
	</div>

	<div class="bg-secondary lg:pb-section px-6 pt-16 pb-10 text-center">
		<a
			class="border-secondary-contrast text-secondary-contrast hover:bg-secondary-contrast hover:text-secondary inline-flex w-full items-center justify-center rounded-full border px-15 py-3 transition-colors sm:w-auto"
			href="https://app.moviapass.com/"
			target="_blank"
			>Ver todas</a
		>
	</div>
</section>
