<section class="bg-surface" aria-labelledby="home-steps-title">
	<div class="max-w-content lg:py-section mx-auto flex flex-col gap-12 px-6 py-20 lg:flex-row lg:items-start lg:gap-13 lg:px-8">
		<img
			class="mx-auto h-auto w-full max-w-md lg:order-last lg:max-w-lg"
			ngSrc="/imgs/home/app-movia.png"
			width="714"
			height="1216"
			alt="La aplicación de Movía mostrando el plan activo, los estudios cercanos y el mapa"
		/>

		<div class="lg:flex-1">
			<h2 id="home-steps-title" class="font-display text-ink lg:text-headline text-3xl font-bold">
				Así Es Como Movia Transforma La Manera En Que Te Mueves
			</h2>

			<ol class="mt-10 grid gap-10 sm:grid-cols-2 lg:mt-13 lg:grid-cols-4 lg:gap-6.5">
				@for (step of steps; track step.number) {
					<li>
						<span class="bg-primary text-primary-contrast flex size-9 items-center justify-center rounded-full font-semibold">
							{{ step.number }}
						</span>

						<h3 class="font-display text-ink text-title mt-6 font-semibold">{{ step.title }}</h3>

						<p class="text-ink mt-4">{{ step.description }}</p>
					</li>
				}
			</ol>
		</div>
	</div>
</section>
