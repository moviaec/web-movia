<section class="bg-surface" aria-labelledby="home-steps-title">
	<!--
		Dos columnas: los pasos ocupan todo el espacio sobrante (`1fr`) y la composición de
		móviles tiene ancho fijo, para que no crezca con la ventana. En móvil la imagen va
		delante del titular, como en el diseño.
	-->
	<div class="max-w-content lg:py-section mx-auto grid gap-8 px-6 py-16 lg:grid-cols-[1fr_22.9rem] lg:items-center lg:gap-12 lg:px-8">
		<img
			class="mx-auto h-auto w-full max-w-md lg:order-last lg:w-full lg:max-w-none"
			ngSrc="/imgs/home/app-movia.png"
			width="714"
			height="1216"
			alt="La aplicación de Movía mostrando el plan activo, los estudios cercanos y el mapa"
		/>

		<div>
			<h2 id="home-steps-title" class="font-display lg:text-headline text-ink text-3xl font-bold">
				Así Es Como Movia Transforma La Manera En Que Te Mueves
			</h2>

			<ol class="mt-10 grid gap-10 sm:grid-cols-2 lg:mt-13 lg:grid-cols-4 lg:gap-[3.5rem]">
				@for (step of steps; track step.number) {
					<li>
						<span
							class="bg-primary text-primary-contrast flex size-7 items-center justify-center rounded-full text-sm font-semibold lg:size-9"
						>
							{{ step.number }}
						</span>

						<h3 class="font-display lg:text-title text-ink mt-6 text-xl font-semibold lg:mt-10">{{ step.title }}</h3>

						<p class="text-ink mt-4 lg:mt-8 lg:text-sm">{{ step.description }}</p>
					</li>
				}
			</ol>
		</div>
	</div>
</section>
