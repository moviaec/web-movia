<section class="bg-secondary relative isolate overflow-hidden" aria-labelledby="home-map-title">
	<img
		class="absolute inset-0 -z-10 object-cover"
		ngSrc="/imgs/home/mapa.png"
		fill
		alt="Mapa de la ciudad con los centros aliados de Movía señalados"
	/>

	<div class="max-w-content lg:py-section mx-auto px-6 py-20 lg:px-10">
		<div class="lg:ml-auto lg:max-w-xl">
			<h2 id="home-map-title" class="font-display text-secondary-contrast lg:text-headline text-3xl font-bold">
				Encuentra tu club más cercano
			</h2>

			<p class="text-secondary-contrast lg:text-body-lg mt-6 text-lg lg:mt-8">
				Descubre todos los centros disponibles cerca de tu casa, trabajo o cerca de donde te encuentras, tu ciudad, o en muchas ciudades de
				Europa.
			</p>

			<a
				class="bg-primary text-primary-contrast mt-10 flex w-full items-center justify-between gap-6 rounded-full px-8 py-5 font-medium transition-opacity hover:opacity-90 sm:w-auto sm:justify-start"
				routerLink="/estudios"
			>
				Encontrar
				<ng-icon class="text-xl" name="heroArrowRight" aria-hidden="true" />
			</a>
		</div>
	</div>
</section>
