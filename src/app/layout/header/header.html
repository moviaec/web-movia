<!--
	El header va SOBRE el hero, sin banda propia: en el diseño la foto llega hasta el
	borde superior de la página. El posicionamiento lo pone `app.html`; aquí solo el
	contenido, que es blanco porque siempre cae sobre una sección oscura.
-->
<div class="text-secondary-contrast max-w-wide mx-auto flex items-center justify-between gap-6 px-6 py-6 lg:px-8 lg:pt-17.5 lg:pb-6.5">
	<div class="flex items-center gap-10 xl:gap-13">
		<a routerLink="/" aria-label="Movía, ir al inicio" (click)="closeMenu()">
			<img class="h-9 w-auto lg:h-10.5" src="/imgs/layout/logo-movia.png" alt="Movía · belong everywhere" width="4106" height="554" />
		</a>

		<nav class="hidden lg:block" aria-label="Navegación principal">
			<ul class="flex items-center gap-10">
				@for (link of navLinks; track link.path) {
					<li>
						<a
							class="text-body-lg hover:text-primary transition-colors"
							[routerLink]="link.path"
							routerLinkActive="text-primary"
							[routerLinkActiveOptions]="{ exact: true }"
							>{{ link.label }}</a
						>
					</li>
				}
			</ul>
		</nav>
	</div>

	<div class="hidden items-center gap-4 lg:flex">
		<a class="bg-secondary-tint flex size-11 items-center justify-center rounded-full" href="#" aria-label="Descargar Movía en el App Store">
			<span class="icon-mask icon-apple bg-secondary-contrast size-5"></span>
		</a>
		<a class="bg-secondary-tint flex size-11 items-center justify-center rounded-full" href="#" aria-label="Descargar Movía en Google Play">
			<span class="icon-mask icon-android bg-secondary-contrast size-5"></span>
		</a>
		<a
			class="bg-primary text-primary-contrast text-body-lg ml-2 rounded-full px-11 py-2.5 font-medium transition-opacity hover:opacity-90"
			href="#"
		>
			Suscribirme
		</a>
	</div>

	<button
		class="focus-visible:ring-primary rounded-lg p-2 focus-visible:ring-2 focus-visible:outline-none lg:hidden"
		type="button"
		[attr.aria-expanded]="menuOpen()"
		aria-controls="header-mobile-menu"
		[attr.aria-label]="menuOpen() ? 'Cerrar el menú' : 'Abrir el menú'"
		(click)="toggleMenu()"
	>
		<span class="icon-mask bg-secondary-contrast size-7" [class]="menuOpen() ? 'icon-menu-close' : 'icon-menu'"></span>
	</button>
</div>

@if (menuOpen()) {
	<div class="bg-secondary text-secondary-contrast border-secondary-tint border-t px-6 pb-8 lg:hidden" id="header-mobile-menu">
		<nav aria-label="Navegación principal">
			<ul class="flex flex-col gap-1 py-4">
				@for (link of navLinks; track link.path) {
					<li>
						<a
							class="text-title block py-3"
							[routerLink]="link.path"
							routerLinkActive="text-primary"
							[routerLinkActiveOptions]="{ exact: true }"
							(click)="closeMenu()"
							>{{ link.label }}</a
						>
					</li>
				}
			</ul>
		</nav>

		<div class="flex items-center gap-4">
			<a class="bg-secondary-tint flex size-11 items-center justify-center rounded-full" href="#" aria-label="Descargar Movía en el App Store">
				<span class="icon-mask icon-apple bg-secondary-contrast size-5"></span>
			</a>
			<a class="bg-secondary-tint flex size-11 items-center justify-center rounded-full" href="#" aria-label="Descargar Movía en Google Play">
				<span class="icon-mask icon-android bg-secondary-contrast size-5"></span>
			</a>
		</div>

		<a class="bg-primary text-primary-contrast text-body-lg mt-6 block rounded-full px-6 py-2.5 text-center font-medium" href="#">
			Suscribirme
		</a>
	</div>
}
