<!doctype html>
<html lang="es-EC">
	<head>
		<meta charset="utf-8" />
		<title>Movía</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			Solo claro, igual que en app-movia y por lo mismo: es lo único que hay diseñado. Con
			"light dark" el navegador en modo oscuro pinta el fondo negro y los neutros del tema
			quedan ilegibles encima.
		-->
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#1C242C" />

		<!--
			El `sizes` del favicon dice el tamaño REAL del archivo (557 × 565). Antes el
			manifest lo declaraba como 64 × 64, que es falso, y un tamaño mentido hace que
			el navegador elija mal el icono cuando hay varios candidatos.
		-->
		<link rel="icon" type="image/png" sizes="557x565" href="favicon.png" />
		<!--
			iOS NO lee el manifest para «Añadir a pantalla de inicio»: busca este `<link>`, y
			sin él genera una miniatura de la captura de pantalla en vez del logo — justo en
			el gesto de más compromiso que hace alguien con el sitio.
		-->
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="manifest.webmanifest" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<app-root></app-root>
	</body>
</html>
