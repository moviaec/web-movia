<!doctype html>
<html lang="es-EC">
	<head>
		<meta charset="utf-8" />
		<title>Movía</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			Solo claro, igual que en app-movia y por lo mismo: es lo único que hay diseñado. Con
			"light dark" el navegador en modo oscuro pinta el fondo negro y los neutros del tema
			quedan ilegibles encima.
		-->
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#1C242C" />

		<!--
			Los tres iconos del navegador, cada uno para quien no entiende a los otros:

			- El `.ico` lleva dentro 16, 32 y 48 px y es lo que piden Windows y los
			  navegadores viejos; se declara a 48 porque es la mayor que contiene.
			- El PNG de 96 es el que usan los navegadores actuales, y sustituye al de
			  557 × 565 que había aquí: un icono siete veces más grande de lo que se
			  llega a pintar, con el tamaño además declarado en falso en el manifest.
			- iOS NO lee el manifest para «Añadir a pantalla de inicio»: busca este
			  `apple-touch-icon` y, sin él, genera una miniatura de la captura en vez
			  del logo — justo en el gesto de más compromiso con el sitio.

			Las tres rutas van ABSOLUTAS, con `/` delante. Hoy `<base href="/">` ya
			resolvería bien una relativa, pero eso ata el icono a que esa etiqueta no
			cambie nunca; sin ella, en `/legal/terms` el navegador buscaría
			`/legal/terms/favicon.png` y no encontraría nada.
		-->
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="manifest.webmanifest" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<app-root></app-root>
	</body>
</html>
